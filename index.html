<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミルコア｜ソーシャルタイプ診断</title><style>
:root{--pink:#ff3f82;--deep:#d9155b;--pale:#fff0f6;--ink:#3b2630;--line:#f6bfd2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffd7e5,#fff8fb 45%,#ffe5ef);min-height:100vh}.app{max-width:540px;margin:auto;min-height:100vh;padding:20px 16px 36px}.card{background:#fff;border:1px solid #fff;border-radius:28px;padding:24px;box-shadow:0 16px 50px #d62d6422}.hero{text-align:center}.hero img{width:100%;max-height:320px;object-fit:contain}.badge{display:inline-block;background:#ffe2ed;color:var(--deep);padding:7px 13px;border-radius:999px;font-weight:800}.hero h1{font-size:38px;line-height:1.05;color:var(--deep);margin:12px 0}.sub{font-weight:800;font-size:18px}.input{width:100%;font-size:18px;padding:16px;border:2px solid var(--line);border-radius:16px;outline:none}.btn{border:0;border-radius:999px;padding:16px 22px;font-size:17px;font-weight:900;cursor:pointer}.primary{width:100%;background:linear-gradient(90deg,#ff5c96,#ed2e70);color:white;box-shadow:0 8px 20px #ee377044}.ghost{background:#fff;color:var(--deep);border:2px solid var(--line)}.tiny{font-size:13px;padding:11px 15px}.hidden{display:none}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.progress{height:10px;background:#ffe2ec;border-radius:99px;flex:1;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ff75a6,#ee2e70);width:0}.qnum{font-weight:900;color:var(--deep)}.question{font-size:25px;line-height:1.45;font-weight:900;margin:22px 0}.choices{display:grid;gap:10px}.choice{padding:15px;border:2px solid #f6c5d6;border-radius:16px;background:#fff;font-weight:800;font-size:16px;cursor:pointer}.choice:hover{background:#fff1f6}.result{text-align:center}.type{font-size:42px;font-weight:1000;color:var(--deep);line-height:1}.jp{font-size:23px;font-weight:900}.score{font-size:52px;font-weight:1000;color:var(--deep)}.box{text-align:left;background:#fff6f9;border-radius:20px;padding:17px;margin:14px 0}.box h3{color:var(--deep);margin:0 0 8px}.share{background:#111;color:#fff;width:100%;margin-top:10px}.actions{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}.note{font-size:12px;color:#80636e;line-height:1.6}.axis{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#fff1f6;padding:12px;border-radius:14px}.metric b{color:var(--deep)}
</style></head><body><main class="app">
<section id="start" class="card hero"><span class="badge">ミルコア｜営業勉強会</span><h1>ソーシャル<br>タイプ診断</h1><p class="sub">あなたの営業タイプと「対応性」がわかる！</p><img src="mascots.png" alt="ミルコアのうさぎキャラクター"><input id="name" class="input" placeholder="お名前・ニックネーム"><div style="height:12px"></div><button class="btn primary" onclick="startQuiz()">診断をはじめる →</button><p class="note">約32問・3〜5分。これは勉強会用の簡易チェックで、公式SOCIAL STYLE®診断ではありません。</p></section>
<section id="quiz" class="card hidden"><div class="top"><div class="progress"><div id="bar" class="bar"></div></div><span id="counter" class="qnum"></span></div><div id="question" class="question"></div><div id="choices" class="choices"></div></section>
<section id="result" class="card result hidden"><span class="badge">診断結果</span><p><span id="rname"></span>さんの営業タイプは…</p><div id="rtype" class="type"></div><div id="rjp" class="jp"></div><p id="tagline" class="sub"></p><div class="axis"><div class="metric">自己主張<br><b id="assert"></b></div><div class="metric">感情表現<br><b id="emotion"></b></div></div><div class="box"><h3>あなたの強み</h3><div id="strength"></div></div><div class="box"><h3>営業で出やすいクセ</h3><div id="habit"></div></div><div class="box"><h3>対応性</h3><div><span id="adapt" class="score"></span> / 100</div><p>相手に合わせて、自分の行動や伝え方を調整する力の自己チェックです。</p></div><div class="box"><h3>対応性を高めるアクション</h3><div id="action"></div></div><button class="btn share" onclick="shareX()">𝕏　Xで結果をシェアする</button><div class="actions"><button class="btn ghost tiny" onclick="saveCard()">結果を画像で保存</button><button class="btn ghost tiny" onclick="sendToHisan()">ひーさんに送る</button></div><p id="sendStatus" class="note"></p><p class="note">#ソーシャルタイプ診断 #ミルコア #営業勉強会</p></section>
</main><script>
const styleQs=[
['話し合いでは、自分の意見をはっきり伝える方だ','A',1],['結論が出ない時間が長いと、早く決めたくなる','A',1],['必要なことは遠慮せず伝えられる','A',1],['人に任せるより、自分から方向性を示すことが多い','A',1],['反対意見があっても、自分の考えを口にできる','A',1],['決断は比較的早い方だ','A',1],['相手に合わせて、自分の意見を引っ込めることが多い','A',-1],['まず相手の意見を聞いてから話したい','A',-1],['初対面でも感情やリアクションが表に出やすい','E',1],['アイデアを思いつくと、まず誰かに話したくなる','E',1],['人と話しながら考えがまとまることが多い','E',1],['楽しい・うれしい・困ったが表情に出やすい','E',1],['仕事でも人との関係性を大切にする','E',1],['雑談を交えながら話すのが好きだ','E',1],['感情より事実や情報を中心に話す方だ','E',-1],['考えを整理してから発言する方だ','E',-1],['初対面では慎重に距離を取る方だ','E',-1],['仕事の会話では雑談は少ない方だ','E',-1],['会話では結論や要点から話すことが多い','A',1],['自分から声をかけ、話を前に進めることが多い','A',1],['場の空気より、目的達成を優先することがある','A',1],['頼まれると断りにくい方だ','A',-1],['数字や根拠があると安心する','E',-1],['相手の気持ちに共感したことを言葉や表情で示す','E',1]
];
const adaptQs=[
'相手によって話すスピードを変えられる','相手の反応を見て、説明量を増減できる','結論を急ぐ相手には、要点から伝えられる','慎重な相手には、根拠や判断材料を増やせる','自分と違う意見でも、まず相手の意図を確認できる','苦手なタイプの相手でも、接し方を工夫できる','自分が話しすぎていると気づいたら、聞く側に切り替えられる','相手が求める距離感に合わせて、雑談や本題の割合を変えられる'];
const questions=[...styleQs.map(x=>({text:x[0],kind:'style',axis:x[1],dir:x[2]})),...adaptQs.map(x=>({text:x,kind:'adapt'}))];
const labels=['まったく当てはまらない','あまり当てはまらない','どちらともいえない','やや当てはまる','とても当てはまる'];let i=0,answers=[],user='';
function startQuiz(){user=document.getElementById('name').value.trim();if(!user){alert('お名前かニックネームを入力してね！');return}document.getElementById('start').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}
function render(){const q=questions[i];document.getElementById('counter').textContent=`${i+1} / ${questions.length}`;document.getElementById('bar').style.width=`${(i/questions.length)*100}%`;document.getElementById('question').textContent=q.text;const c=document.getElementById('choices');c.innerHTML='';labels.forEach((x,n)=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answer(n+1);c.appendChild(b)})}
function answer(v){answers.push(v);i++;if(i<questions.length)render();else showResult()}
const info={DRIVING:{jp:'主導型',tag:'ゴールへ引っ張る推進タイプ！',strength:'決断力・推進力・ゴール志向。要点をつかんで前へ進めるのが得意。',habit:'結論を急いだり、相手のペースを待たずに進めすぎることも。',action:'相手が話し終わるまで待つ。質問を1つ増やし、反応を確認してから次へ進もう。'},EXPRESSIVE:{jp:'表現型',tag:'人を巻き込むムードメーカータイプ！',strength:'発信力・関係構築力・アイデアを魅力的に伝える力。',habit:'熱量が先行して、話しすぎたり自分のテンポで進めることも。',action:'相手の反応を確認する時間をつくる。要点を整理し、聞く時間を意識して増やそう。'},AMIABLE:{jp:'協調型',tag:'安心感をつくるサポータータイプ！',strength:'共感力・傾聴力・相手が話しやすい空気をつくる力。',habit:'相手に合わせすぎて、提案や自分の意見を控えてしまうことも。',action:'相手を尊重しつつ、自分の提案を1つ明確に言葉にしてみよう。'},ANALYTICAL:{jp:'分析型',tag:'信頼を積み上げるロジカルタイプ！',strength:'情報整理・正確さ・根拠をもとに丁寧に考える力。',habit:'情報を集めすぎたり、確信が持てるまで動きにくくなることも。',action:'完璧になる前に仮説を伝える。相手が必要とする情報量を確認してから深掘りしよう。'}};
function calc(){let A=0,E=0,ac=0,an=0;questions.forEach((q,n)=>{let centered=answers[n]-3;if(q.kind==='style'){if(q.axis==='A'){A+=centered*q.dir;ac++}else{E+=centered*q.dir;an++}}});let type=A>=0?(E>=0?'EXPRESSIVE':'DRIVING'):(E>=0?'AMIABLE':'ANALYTICAL');let av=answers.slice(styleQs.length);let adapt=Math.round(av.reduce((s,x)=>s+x,0)/(av.length*5)*100);return{A,E,type,adapt}}
function showResult(){let r=calc(),d=info[r.type];document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('rname').textContent=user;document.getElementById('rtype').textContent=r.type;document.getElementById('rjp').textContent=d.jp;document.getElementById('tagline').textContent=d.tag;document.getElementById('strength').textContent=d.strength;document.getElementById('habit').textContent=d.habit;document.getElementById('action').textContent=d.action;document.getElementById('adapt').textContent=r.adapt;document.getElementById('assert').textContent=r.A>=0?'高め':'控えめ';document.getElementById('emotion').textContent=r.E>=0?'豊か':'控えめ';window.resultData={name:user,...r}}
function shareX(){let r=window.resultData,d=info[r.type];let text=`私の営業タイプは「${r.type}｜${d.jp}」でした！\n対応性は ${r.adapt}/100 ✨\n\n#ソーシャルタイプ診断 #ミルコア #営業勉強会`;window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text),'_blank')}
function sendToHisan(){let url=localStorage.getItem('hisanEndpoint')||'';if(!url){document.getElementById('sendStatus').textContent='集計先は未接続です。GASのWebアプリURLを設定すると送信できます。';return}fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...window.resultData,answers,createdAt:new Date().toISOString()})}).then(()=>document.getElementById('sendStatus').textContent='ひーさんに結果を送りました！').catch(()=>document.getElementById('sendStatus').textContent='送信できませんでした。')}
function saveCard(){window.print()}
</script></body></html>
